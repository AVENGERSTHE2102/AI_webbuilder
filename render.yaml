services:
  # Full-Stack Web Service (Backend + Frontend)
  - type: web
    name: ai-webbuilder
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt &&
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash &&
      export NVM_DIR="$HOME/.nvm" &&
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" &&
      nvm install 18 &&
      nvm use 18 &&
      cd frontend &&
      npm install &&
      npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENROUTER_API_KEY
        sync: false  # Set this in Render dashboard - Get $5 free at https://openrouter.ai/
    healthCheckPath: /
